# Streamlit Cloud → 앱 Settings → Secrets 에 붙여 넣는 예시입니다.
# 이 파일에는 진짜 값을 넣지 마세요. (secrets.toml 은 저장소에 올라가지 않습니다)

# 계정·사용자 설정을 저장할 관리용 구글시트 (빈 시트 하나 만들고 서비스 계정에 편집자로 공유)
admin_sheet_url = "https://docs.google.com/spreadsheets/d/관리용시트ID/edit"

# 관리자 로그인 (계정 관리 탭이 보입니다)
[admin]
id = "admin"
password = "여기에-긴-비밀번호"

# 구글 클라우드 서비스 계정 키(JSON)의 내용을 그대로 옮깁니다
[gcp_service_account]
type = "service_account"
project_id = ""
private_key_id = ""
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = ""
client_id = ""
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = ""
